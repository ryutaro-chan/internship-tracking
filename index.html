<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<title>JobTrackr — Organize the hunt. Catch the offer.</title>
<meta name="description" content="JobTrackr — track your internship and job applications." />
<!-- Clean circular emblem favicon: pastel-blue circle with a slate crosshair 'o' -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23D1E9FF'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%231E293B' stroke-width='4'/%3E%3Cline x1='32' y1='9' x2='32' y2='19' stroke='%231E293B' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='32' y1='45' x2='32' y2='55' stroke='%231E293B' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='9' y1='32' x2='19' y2='32' stroke='%231E293B' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='45' y1='32' x2='55' y2='32' stroke='%231E293B' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
<meta property="og:title" content="JobTrackr" />
<meta property="og:type" content="website" />
<meta property="og:image" content="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 630'%3E%3Crect width='1200' height='630' fill='%23F8FAFC'/%3E%3Ccircle cx='600' cy='300' r='150' fill='%23D1E9FF'/%3E%3Ccircle cx='600' cy='300' r='62' fill='none' stroke='%231E293B' stroke-width='18'/%3E%3Cline x1='600' y1='192' x2='600' y2='238' stroke='%231E293B' stroke-width='18' stroke-linecap='round'/%3E%3Cline x1='600' y1='362' x2='600' y2='408' stroke='%231E293B' stroke-width='18' stroke-linecap='round'/%3E%3Cline x1='492' y1='300' x2='538' y2='300' stroke='%231E293B' stroke-width='18' stroke-linecap='round'/%3E%3Cline x1='662' y1='300' x2='708' y2='300' stroke='%231E293B' stroke-width='18' stroke-linecap='round'/%3E%3Ctext x='600' y='520' font-family='-apple-system,Segoe UI,Roboto,sans-serif' font-size='72' font-weight='800' fill='%231E293B' text-anchor='middle'%3EJobTrackr%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=20261020e" />
</head>
<body>
<div class="app" id="app">

  <!-- App bar -->
  <header class="appbar">
    <div class="top">
      <div class="brand">
        <span class="logo-emblem">
          <h1 class="wordmark">J<span class="logo-crosshair">o</span>bTrackr<span class="logo-star" aria-hidden="true">★</span></h1>
        </span>
        <div class="tagline" id="appbarSub">Organize the hunt. Catch the offer.</div>
      </div>

      <!-- Desktop-only header tab navigation -->
      <nav class="header-nav" id="headerNav">
        <button class="htab active" data-tab="dashboard"><span class="ic">🏠</span>Dashboard</button>
        <button class="htab" data-tab="applications"><span class="ic">🗂️</span>Applications</button>
        <button class="htab" data-tab="analytics"><span class="ic">📊</span>Analytics</button>
        <button class="htab" data-tab="compare"><span class="ic">⚖️</span>Compare</button>
      </nav>

      <div class="appbar-actions">
        <button class="btn-new-desktop" id="addDesktop">＋ New Application</button>
        <button class="icon-pill" id="moreBtn" title="Export / Import">⋯</button>
      </div>
    </div>

    <div class="search" id="searchWrap">
      <span class="ico">🔍</span>
      <input id="search" placeholder="Search company, role, location…" />
      <span class="kbd" id="kbdHint">⌘K</span>
    </div>

    <div class="filters" id="filterRow">
      <select class="ctl" id="statusFilter">
        <option value="__all">All Statuses</option>
        <option value="__pending">Awaiting Reply</option>
        <option value="__bookmarked">★ Bookmarked</option>
        <option value="__sep" disabled>──────────</option>
      </select>
      <select class="ctl" id="sortBy">
        <option value="updated">Last Updated</option>
        <option value="deadline">Deadline (Soonest)</option>
        <option value="applied">Date Applied</option>
        <option value="stipend">Stipend (High to Low)</option>
        <option value="company">Company (A–Z)</option>
      </select>
    </div>

    <div class="subbar" id="subbar">
      <div class="seg" id="viewSeg">
        <button data-view="feed" class="active">📰 Feed</button>
        <button data-view="board">📋 Board</button>
        <button data-view="calendar">📅 Calendar</button>
      </div>
      <div class="subbar-actions">
        <button class="quick-pill" id="favToggle" title="Show only starred applications">★ Favorites</button>
        <button class="quick-pill" id="exportCsvQuick" title="Download your pipeline as CSV">📥 Export CSV</button>
      </div>
    </div>
  </header>

  <!-- Scrollable content -->
  <main class="scroll" id="scroll">
    <!-- Dashboard tab -->
    <section id="tab-dashboard">
      <div class="summary" id="summary"></div>
      <div class="section-label" id="feedLabel">Job Applications</div>
      <div class="cat-tabs" id="catTabs"></div>
      <div id="view"></div>
    </section>

    <!-- Applications tab (reuses feed) -->
    <section id="tab-applications" class="hidden">
      <div class="section-label">Job Applications</div>
      <div class="cat-tabs" id="catTabsApps"></div>
      <div id="viewApps"></div>
    </section>

    <!-- Analytics tab -->
    <section id="tab-analytics" class="hidden">
      <div class="section-label">Overview</div>
      <div class="summary" id="summary2"></div>
      <div class="section-label">📅 Deadline Calendar</div>
      <div class="cal-card" id="calendar"></div>
      <div class="section-label">Status Breakdown</div>
      <div class="analytics" id="analytics"></div>
    </section>

    <!-- Compare tab -->
    <section id="tab-compare" class="hidden">
      <div class="section-label">⚖ Compare Roles — Best Fit</div>
      <div id="compareInline"></div>
    </section>
  </main>

  <!-- Floating action button -->
  <button class="fab" id="fab" title="New application">＋</button>

  <!-- Bottom navigation -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="navtab active" data-tab="dashboard"><span class="ic">🏠</span>Dashboard</button>
    <button class="navtab" data-tab="applications"><span class="ic">🗂️</span>Applications</button>
    <button class="navtab" data-tab="analytics"><span class="ic">📊</span>Analytics</button>
    <button class="navtab" data-tab="compare"><span class="ic">⚖️</span>Compare</button>
  </nav>
</div>

<!-- Add/Edit sheet -->
<div class="modal-bg" id="modalBg">
  <div class="sheet">
    <div class="grab"></div>
    <div class="sheet-head">
      <h2 id="modalTitle">New Application</h2>
      <button class="icon-btn" id="closeModal">✕</button>
    </div>
    <div class="sheet-body">
      <form id="form">
        <input type="hidden" id="f_id" />
        <div class="section-title">Job Info</div>
        <div class="form-grid">
          <div class="field full"><label>Company *</label><input id="f_company" required placeholder="Stripe" /></div>
          <div class="field full"><label>Role *</label><input id="f_role" required placeholder="Software Engineer" /></div>
          <div class="field"><label>Availability Start</label><input type="date" id="appStartDate" /></div>
          <div class="field"><label>Availability End</label><input type="date" id="appEndDate" /></div>
          <div class="field"><label>Location</label><input id="f_location" placeholder="Singapore / Hybrid" /></div>
          <div class="field"><label>Compensation</label><input id="f_comp" placeholder="$1,500/mo" /></div>
          <div class="field"><label>Status</label><select id="f_status"></select></div>
          <div class="field full"><label>Category</label><select id="f_category"></select></div>
        </div>
        <div class="field full"><label>Job Description</label><textarea id="f_jobdesc" placeholder="Paste job description or requirements..."></textarea></div>
        <div class="field full"><label>Portal URL</label><input id="f_url" type="url" placeholder="https://..." /></div>

        <div class="section-title">Dates</div>
        <div class="form-grid">
          <div class="field"><label>Applied</label><input id="f_appliedDate" type="date" /></div>
          <div class="field"><label>Deadline</label><input id="f_deadline" type="date" /></div>
          <div class="field full"><label>Follow-up</label><input id="f_followup" type="date" /></div>
        </div>
        <div class="section-title">Interview</div>
        <div class="form-grid">
          <div class="field"><label>Online Assessment / Test</label><input id="f_oaDate" type="date" /></div>
          <div class="field"><label>Interview</label><input id="f_interviewDates" type="date" /></div>
          <div class="field full"><label>Notes</label><textarea id="f_stageNotes" placeholder="Stage notes..."></textarea></div>
        </div>
        <div class="section-title">Offer</div>
        <div class="form-grid">
          <div class="field"><label>Hours</label><input id="f_hours" placeholder="Full-time, 12 weeks" /></div>
          <div class="field"><label>Decide By</label><input id="f_offerDeadline" type="date" /></div>
          <div class="field"><label>Priority</label><select id="f_priority"><option value="">—</option><option>High</option><option>Medium</option><option>Low</option></select></div>
          <div class="field full"><label>Notes</label><textarea id="f_prosCons" placeholder="Pros, cons, thoughts..."></textarea></div>
        </div>
        <div class="section-title">Follow Up</div>
        <div class="form-grid">
          <div class="field full"><label>Referral</label><input id="f_referral" placeholder="Name · LinkedIn" /></div>
          <div class="field full"><label>Resume Version</label><input id="f_docs" placeholder="SWE_Resume_v2.pdf" /></div>
          <div class="field full"><label>Next Action</label><input id="f_nextAction" placeholder="Follow up with recruiter" /></div>
        </div>
      </form>
    </div>
    <div class="sheet-foot">
      <button class="btn" id="cancelBtn" type="button">Cancel</button>
      <button class="btn btn-primary" id="saveBtn" type="button">Save</button>
    </div>
  </div>
</div>

<!-- Quick status-change sheet -->
<div class="modal-bg" id="statusBg">
  <div class="sheet" style="max-height:auto">
    <div class="grab"></div>
    <div class="sheet-head"><h2>Update Status</h2><button class="icon-btn" id="closeStatus">✕</button></div>
    <div class="sheet-body" id="statusBody"></div>
  </div>
</div>

<!-- More menu sheet -->
<div class="modal-bg" id="moreBg">
  <div class="sheet">
    <div class="grab"></div>
    <div class="sheet-head"><h2>More</h2><button class="icon-btn" id="closeMore">✕</button></div>
    <div class="sheet-body">
      <div class="section-label" style="margin-top:0" id="syncBadge"></div>
      <button class="btn" id="exportCsvBtn" style="width:100%; margin-bottom:10px;">📊 Export to CSV (spreadsheet)</button>
      <button class="btn" id="exportBtn" style="width:100%; margin-bottom:10px;">⬇ Export data (JSON)</button>
      <button class="btn" id="importBtn" style="width:100%; margin-bottom:10px;">⬆ Import data (JSON)</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" />
      <button class="btn" id="sampleBtn" style="width:100%;">✨ Load sample data</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js?v=20261020e" defer></script>
</body>
</html>
