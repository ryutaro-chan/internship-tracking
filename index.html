<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Internship Tracker</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-subtle: #f7f7f5;
    --panel: #ffffff;
    --hover: #f1f1ef;
    --border: #e9e9e7;
    --border-strong: #dcdcda;
    --text: #37352f;
    --text-2: #5f5e5a;
    --muted: #9b9a97;
    --faint: #cfcfcd;
    --accent: #2383e2;
    --accent-soft: #e7f1fb;
    --radius: 6px;
    --radius-lg: 10px;
    --shadow: 0 1px 2px rgba(15,15,15,.06), 0 3px 8px rgba(15,15,15,.05);
    --shadow-pop: 0 8px 28px rgba(15,15,15,.14);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;

    /* status palette (Notion-ish muted tints) */
    --s-gray-bg: #efefed;   --s-gray-fg: #605f5b;
    --s-blue-bg: #e3eefb;   --s-blue-fg: #1f5fa6;
    --s-purple-bg: #eee7fb; --s-purple-fg: #6940a5;
    --s-teal-bg: #ddf1ef;   --s-teal-fg: #157a6e;
    --s-green-bg: #dcf0e2;  --s-green-fg: #27825b;
    --s-red-bg: #fbe4e2;    --s-red-fg: #b6392f;
    --s-amber-bg: #fbeecf;  --s-amber-fg: #9a6a17;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Layout ---------- */
  .page { max-width: 1080px; margin: 0 auto; padding: 40px 48px 80px; }
  @media (max-width: 720px) { .page { padding: 28px 18px 60px; } }

  .title-row { display: flex; align-items: center; gap: 12px; }
  .emoji { font-size: 34px; line-height: 1; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 6px 0 0 46px; }
  @media (max-width: 720px) { .subtitle { margin-left: 0; } }

  /* ---------- Stat strip ---------- */
  .stats { display: flex; gap: 28px; margin: 26px 0 22px; flex-wrap: wrap; }
  .stat .num { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .stat .num.blue { color: var(--s-blue-fg); }
  .stat .num.green { color: var(--s-green-fg); }
  .stat .num.red { color: var(--s-red-fg); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding-bottom: 10px; margin-bottom: 2px;
    border-bottom: 1px solid var(--border);
  }
  .search { flex: 1; min-width: 180px; position: relative; }
  .search input {
    width: 100%; border: none; background: transparent; outline: none;
    font-family: inherit; font-size: 14px; color: var(--text);
    padding: 6px 6px 6px 24px;
  }
  .search::before {
    content: "🔍"; position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
    font-size: 12px; opacity: .5;
  }
  .search input::placeholder { color: var(--muted); }

  select, .btn {
    font-family: inherit; font-size: 13.5px; color: var(--text-2);
    background: transparent; border: 1px solid transparent; border-radius: var(--radius);
    padding: 5px 9px; cursor: pointer; transition: background .12s, border-color .12s;
    outline: none;
  }
  select:hover, .btn:hover { background: var(--hover); }
  select { border-color: transparent; -webkit-appearance: none; appearance: none;
    padding-right: 22px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%239b9a97' stroke-width='1.3'/></svg>");
    background-repeat: no-repeat; background-position: right 7px center;
  }
  .chk { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13.5px; cursor: pointer; padding: 5px 4px; user-select: none; }
  .chk input { accent-color: var(--accent); }

  .btn-primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
    font-weight: 500; padding: 6px 13px;
  }
  .btn-primary:hover { background: #1a73c7; }
  .seg { display: inline-flex; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .seg button { border: none; background: transparent; padding: 5px 11px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .seg button.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }

  /* ---------- Table view ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    text-align: left; font-weight: 500; color: var(--muted); font-size: 12px;
    padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--bg-subtle); }
  td .co { font-weight: 600; color: var(--text); }
  td .rl { color: var(--text-2); }
  td .sub { color: var(--muted); font-size: 12px; }
  .nowrap { white-space: nowrap; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }

  .tag { display: inline-block; padding: 1px 7px; border-radius: 4px; background: var(--s-gray-bg); color: var(--s-gray-fg); font-size: 11.5px; }
  .flag { color: var(--s-amber-fg); font-size: 11.5px; font-weight: 500; }
  .flag.past { color: var(--muted); font-weight: 400; }
  a.link { color: var(--accent); text-decoration: none; }
  a.link:hover { text-decoration: underline; }
  .row-actions { opacity: 0; transition: opacity .12s; white-space: nowrap; text-align: right; }
  tbody tr:hover .row-actions { opacity: 1; }
  .icon-btn { border: none; background: transparent; cursor: pointer; color: var(--muted); padding: 3px 6px; border-radius: 4px; font-size: 13px; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn.del:hover { color: var(--s-red-fg); }

  /* ---------- Board view ---------- */
  .board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; }
  .col { flex: 0 0 260px; }
  .col-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); font-weight: 500; padding: 4px 4px 10px; }
  .col-head .count { color: var(--muted); font-weight: 400; }
  .col-head .sw { width: 9px; height: 9px; border-radius: 3px; }
  .bcard {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 11px; margin-bottom: 8px; box-shadow: var(--shadow); cursor: pointer;
  }
  .bcard:hover { border-color: var(--border-strong); }
  .bcard .bco { font-weight: 600; font-size: 13.5px; }
  .bcard .brl { color: var(--text-2); font-size: 12.5px; margin-top: 1px; }
  .bcard .bmeta { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }

  .empty { text-align: center; color: var(--muted); padding: 70px 20px; }
  .empty b { color: var(--text-2); }

  /* ---------- Modal (Notion peek panel) ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,15,15,.32); display: none; z-index: 60; }
  .modal-bg.show { display: block; }
  .modal {
    position: fixed; top: 0; right: 0; height: 100%; width: 100%; max-width: 620px;
    background: var(--panel); box-shadow: var(--shadow-pop);
    display: flex; flex-direction: column; transform: translateX(100%);
    transition: transform .22s ease;
  }
  .modal-bg.show .modal { transform: translateX(0); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { font-size: 15px; font-weight: 600; margin: 0; color: var(--text-2); }
  .modal-body { padding: 24px 26px; overflow-y: auto; flex: 1; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--border); }

  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 26px 0 12px; }
  .section-title:first-child { margin-top: 0; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .field.full { grid-column: 1 / -1; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--bg-subtle); border: 1px solid transparent; border-radius: var(--radius);
    padding: 8px 10px; outline: none; transition: background .12s, border-color .12s, box-shadow .12s;
  }
  .field input::placeholder, .field textarea::placeholder { color: var(--faint); }
  .field input:hover, .field select:hover, .field textarea:hover { background: var(--hover); }
  .field input:focus, .field select:focus, .field textarea:focus {
    background: var(--panel); border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .field textarea { resize: vertical; min-height: 56px; }
  .field select {
    -webkit-appearance: none; appearance: none; padding-right: 26px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%239b9a97' stroke-width='1.3'/></svg>");
    background-repeat: no-repeat; background-position: right 9px center;
  }

  @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="page">

  <div class="title-row">
    <span class="emoji">🎯</span>
    <h1>Internship Tracker</h1>
  </div>
  <p class="subtitle">Every application, deadline, and interview stage — in one calm place.</p>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="search"><input id="search" placeholder="Search company, role, location, notes…" /></div>
    <div class="seg" id="viewSeg">
      <button data-view="table" class="active">Table</button>
      <button data-view="board">Board</button>
    </div>
    <select id="statusFilter"><option value="">All statuses</option></select>
    <select id="sortBy">
      <option value="updated">Last updated</option>
      <option value="deadline">Deadline (soonest)</option>
      <option value="applied">Date applied</option>
      <option value="company">Company (A–Z)</option>
    </select>
    <label class="chk"><input type="checkbox" id="pendingOnly" /> Awaiting reply</label>
    <span style="flex:1"></span>
    <button class="btn" id="exportBtn">Export</button>
    <button class="btn" id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" />
    <button class="btn btn-primary" id="addBtn">＋ New</button>
  </div>

  <div id="view"></div>
</div>

<!-- Side-panel modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">New application</h2>
      <button class="icon-btn" id="closeModal">✕</button>
    </div>
    <div class="modal-body">
      <form id="form">
        <input type="hidden" id="f_id" />

        <div class="section-title">Core information</div>
        <div class="form-grid">
          <div class="field"><label>Company name *</label><input id="f_company" required placeholder="e.g. Stripe" /></div>
          <div class="field"><label>Role / job title *</label><input id="f_role" required placeholder="e.g. Software Engineering Intern" /></div>
          <div class="field"><label>Target period / term</label><input id="f_term" placeholder="e.g. Summer 2027 (May–Aug)" /></div>
          <div class="field"><label>Location & work type</label><input id="f_location" placeholder="e.g. Singapore / Hybrid" /></div>
          <div class="field full"><label>Application status</label><select id="f_status"></select></div>
        </div>

        <div class="section-title">Logistics & key dates</div>
        <div class="form-grid">
          <div class="field"><label>Application date</label><input id="f_appliedDate" type="date" /></div>
          <div class="field"><label>Application deadline</label><input id="f_deadline" type="date" /></div>
          <div class="field full"><label>Job description / portal URL</label><input id="f_url" type="url" placeholder="https://…" /></div>
          <div class="field"><label>Last updated / follow-up date</label><input id="f_followup" type="date" /></div>
        </div>

        <div class="section-title">Process & interview tracking</div>
        <div class="form-grid">
          <div class="field"><label>Online assessment / test date</label><input id="f_oaDate" type="date" /></div>
          <div class="field"><label>Interview date(s)</label><input id="f_interviewDates" placeholder="e.g. Oct 22, Nov 3" /></div>
          <div class="field full"><label>Interviewer name / title</label><input id="f_interviewer" placeholder="e.g. Jane Tan, Eng Manager" /></div>
          <div class="field full"><label>Current stage notes</label><textarea id="f_stageNotes" placeholder="e.g. Completed HackerRank test on Oct 15; waiting for results"></textarea></div>
        </div>

        <div class="section-title">Offer & decision</div>
        <div class="form-grid">
          <div class="field"><label>Compensation / allowance</label><input id="f_comp" placeholder="e.g. $1,500/month" /></div>
          <div class="field"><label>Work hours & duration</label><input id="f_hours" placeholder="e.g. Full-time, 12 weeks" /></div>
          <div class="field"><label>Offer deadline / decision date</label><input id="f_offerDeadline" type="date" /></div>
          <div class="field"><label>Priority rating</label><select id="f_priority"><option value="">—</option><option>High</option><option>Medium</option><option>Low</option></select></div>
          <div class="field full"><label>Pros & cons</label><textarea id="f_prosCons" placeholder="Pros: …   Cons: …"></textarea></div>
        </div>

        <div class="section-title">Extras & action items</div>
        <div class="form-grid">
          <div class="field full"><label>Referral / contact person</label><input id="f_referral" placeholder="Name + email / LinkedIn" /></div>
          <div class="field full"><label>Resume / cover letter version used</label><input id="f_docs" placeholder="e.g. Software_Engineer_v2.pdf" /></div>
          <div class="field full"><label>Next action item</label><input id="f_nextAction" placeholder="e.g. Send follow-up email to recruiter" /></div>
        </div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancelBtn" type="button">Cancel</button>
      <button class="btn btn-primary" id="saveBtn" type="button">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var STORAGE_KEY = "internship-tracker.v1";

  // status -> palette key + whether awaiting reply
  var STATUSES = [
    { name: "Not Started / To Apply",        key: "gray",   pending: false },
    { name: "Applied / Pending",             key: "blue",   pending: true  },
    { name: "OA / Technical Assessment",     key: "purple", pending: true  },
    { name: "HR / Screening Interview",      key: "teal",   pending: true  },
    { name: "Technical / Round 1 Interview", key: "teal",   pending: true  },
    { name: "Final Round Interview",         key: "green",  pending: true  },
    { name: "Offer Received",                key: "green",  pending: false },
    { name: "Rejected",                      key: "red",    pending: false },
    { name: "Withdrawn",                     key: "gray",   pending: false }
  ];

  var FIELDS = [
    "company","role","term","location","status",
    "appliedDate","deadline","url","followup",
    "oaDate","interviewDates","interviewer","stageNotes",
    "comp","hours","offerDeadline","priority","prosCons",
    "referral","docs","nextAction"
  ];

  var data = load();
  var editingId = null;
  var view = "table";

  function load() { try { var r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : []; } catch (e) { return []; } }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function statusDef(name) { for (var i=0;i<STATUSES.length;i++) if (STATUSES[i].name===name) return STATUSES[i]; return STATUSES[0]; }
  function pillStyle(key) { return "background:var(--s-"+key+"-bg);color:var(--s-"+key+"-fg);"; }

  function fmtDate(d) {
    if (!d) return "";
    var p = d.split("-"); if (p.length!==3) return d;
    var m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return m[parseInt(p[1],10)-1] + " " + parseInt(p[2],10) + ", " + p[0];
  }
  function daysUntil(d) {
    if (!d) return null;
    var t = new Date(); t.setHours(0,0,0,0);
    return Math.round((new Date(d+"T00:00:00") - t) / 86400000);
  }
  function deadlineFlag(d, status) {
    var du = daysUntil(d);
    if (du === null) return "";
    if (du < 0) return '<span class="flag past">passed</span>';
    var live = (status === "Not Started / To Apply" || status === "Applied / Pending");
    if (du === 0) return '<span class="flag">today!</span>';
    if (du <= 7 && live) return '<span class="flag">'+du+'d left</span>';
    return "";
  }

  function fillStatusSelects() {
    var opts = STATUSES.map(function (s){ return '<option value="'+esc(s.name)+'">'+esc(s.name)+'</option>'; }).join("");
    $("f_status").innerHTML = opts;
    $("statusFilter").innerHTML = '<option value="">All statuses</option>' + opts;
  }

  function renderStats() {
    var total = data.length;
    var pending = data.filter(function (x){ return statusDef(x.status).pending; }).length;
    var offers = data.filter(function (x){ return x.status==="Offer Received"; }).length;
    var rejected = data.filter(function (x){ return x.status==="Rejected"; }).length;
    $("stats").innerHTML =
      stat(total,"Total","") + stat(pending,"Awaiting reply","blue") +
      stat(offers,"Offers","green") + stat(rejected,"Rejected","red");
  }
  function stat(n,l,c){ return '<div class="stat"><div class="num '+c+'">'+n+'</div><div class="lbl">'+l+'</div></div>'; }

  function filtered() {
    var q = $("search").value.trim().toLowerCase();
    var sf = $("statusFilter").value;
    var po = $("pendingOnly").checked;
    var sort = $("sortBy").value;
    var rows = data.filter(function (x) {
      if (sf && x.status!==sf) return false;
      if (po && !statusDef(x.status).pending) return false;
      if (q) {
        var hay = [x.company,x.role,x.location,x.term,x.stageNotes,x.referral,x.nextAction,x.status].join(" ").toLowerCase();
        if (hay.indexOf(q)===-1) return false;
      }
      return true;
    });
    rows.sort(function (a,b) {
      if (sort==="company") return (a.company||"").localeCompare(b.company||"");
      if (sort==="applied") return (b.appliedDate||"").localeCompare(a.appliedDate||"");
      if (sort==="deadline") return (a.deadline||"9999").localeCompare(b.deadline||"9999");
      return (b._updated||0)-(a._updated||0);
    });
    return rows;
  }

  function render() {
    renderStats();
    var rows = filtered();
    if (!rows.length) {
      $("view").innerHTML = '<div class="empty">' +
        (data.length ? "No applications match your filters." :
         "Nothing here yet. Click <b>＋ New</b> to add your first application.") + '</div>';
      return;
    }
    if (view === "board") renderBoard(rows); else renderTable(rows);
    wireRows();
  }

  function renderTable(rows) {
    var head = "<tr>" +
      "<th>Company / Role</th><th>Status</th><th>Term</th><th>Location</th>" +
      "<th>Applied</th><th>Deadline</th><th>Next action</th><th></th></tr>";
    var body = rows.map(function (x) {
      var sd = statusDef(x.status);
      return '<tr data-open="'+x.id+'">' +
        '<td><div class="co">'+esc(x.company||"—")+'</div><div class="rl">'+esc(x.role||"")+'</div></td>' +
        '<td><span class="pill" style="'+pillStyle(sd.key)+'"><span class="dot"></span>'+esc(x.status)+'</span></td>' +
        '<td class="sub nowrap">'+esc(x.term||"")+'</td>' +
        '<td class="sub">'+esc(x.location||"")+'</td>' +
        '<td class="sub nowrap">'+esc(fmtDate(x.appliedDate))+'</td>' +
        '<td class="sub nowrap">'+(x.deadline?esc(fmtDate(x.deadline))+" "+deadlineFlag(x.deadline,x.status):"")+'</td>' +
        '<td class="sub">'+esc(x.nextAction||"")+'</td>' +
        '<td class="row-actions">' +
          '<button class="icon-btn" data-edit="'+x.id+'" title="Edit">✎</button>' +
          '<button class="icon-btn del" data-del="'+x.id+'" title="Delete">🗑</button>' +
        '</td></tr>';
    }).join("");
    $("view").innerHTML = '<div class="table-wrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
  }

  function renderBoard(rows) {
    var cols = STATUSES.map(function (s) {
      var items = rows.filter(function (x){ return x.status===s.name; });
      var cards = items.map(function (x) {
        var bits = [];
        if (x.term) bits.push('<span class="tag">'+esc(x.term)+'</span>');
        if (x.deadline) bits.push('<span class="sub nowrap">⏳ '+esc(fmtDate(x.deadline))+'</span>');
        if (x.location) bits.push('<span class="sub">'+esc(x.location)+'</span>');
        return '<div class="bcard" data-open="'+x.id+'">' +
          '<div class="bco">'+esc(x.company||"—")+'</div>' +
          '<div class="brl">'+esc(x.role||"")+'</div>' +
          (bits.length?'<div class="bmeta">'+bits.join("")+'</div>':'') +
          '</div>';
      }).join("");
      return '<div class="col">' +
        '<div class="col-head"><span class="sw" style="'+pillStyle(s.key)+'"></span>'+esc(s.name)+' <span class="count">'+items.length+'</span></div>' +
        cards + '</div>';
    }).join("");
    $("view").innerHTML = '<div class="board">'+cols+'</div>';
  }

  function wireRows() {
    var v = $("view");
    Array.prototype.forEach.call(v.querySelectorAll("[data-open]"), function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.closest("[data-edit],[data-del]")) return;
        openModal(el.getAttribute("data-open"));
      });
    });
    Array.prototype.forEach.call(v.querySelectorAll("[data-edit]"), function (b) {
      b.addEventListener("click", function (e){ e.stopPropagation(); openModal(b.getAttribute("data-edit")); });
    });
    Array.prototype.forEach.call(v.querySelectorAll("[data-del]"), function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = b.getAttribute("data-del");
        var item = data.find(function (x){ return x.id===id; });
        if (confirm('Delete "' + (item ? item.company+" — "+item.role : "this") + '"?')) {
          data = data.filter(function (x){ return x.id!==id; }); save(); render();
        }
      });
    });
  }

  function openModal(id) {
    editingId = id || null;
    $("modalTitle").textContent = id ? "Edit application" : "New application";
    var item = (id ? data.find(function (x){ return x.id===id; }) : {}) || {};
    FIELDS.forEach(function (f){ var el=$("f_"+f); if (el) el.value = item[f]!=null?item[f]:""; });
    if (!id) $("f_status").value = "Not Started / To Apply";
    $("f_id").value = id || "";
    $("modalBg").classList.add("show");
    setTimeout(function (){ $("f_company").focus(); }, 60);
  }
  function closeModal() { $("modalBg").classList.remove("show"); editingId = null; }

  function saveForm() {
    var company = $("f_company").value.trim(), role = $("f_role").value.trim();
    if (!company || !role) { alert("Company name and role / job title are required."); return; }
    var obj = editingId ? data.find(function (x){ return x.id===editingId; }) : null;
    if (!obj) { obj = { id: uid() }; data.push(obj); }
    FIELDS.forEach(function (f){ var el=$("f_"+f); if (el) obj[f] = el.value.trim(); });
    obj._updated = Date.now();
    save(); closeModal(); render();
  }

  function exportData() {
    var blob = new Blob([JSON.stringify(data,null,2)], { type:"application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "internship-tracker-" + new Date().toISOString().slice(0,10) + ".json";
    a.click(); URL.revokeObjectURL(a.href);
  }
  function importData(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var parsed = JSON.parse(r.result);
        if (!Array.isArray(parsed)) throw new Error("Invalid file");
        if (!confirm("Import "+parsed.length+" application(s)? This replaces current data.")) return;
        data = parsed.map(function (x){ if (!x.id) x.id=uid(); if (!x._updated) x._updated=Date.now(); return x; });
        save(); render();
      } catch (e) { alert("Could not import: " + e.message); }
    };
    r.readAsText(file);
  }

  // wire up
  fillStatusSelects();
  $("addBtn").onclick = function (){ openModal(null); };
  $("closeModal").onclick = closeModal;
  $("cancelBtn").onclick = closeModal;
  $("saveBtn").onclick = saveForm;
  $("modalBg").addEventListener("click", function (e){ if (e.target===$("modalBg")) closeModal(); });
  document.addEventListener("keydown", function (e) {
    if (e.key==="Escape") closeModal();
    if (e.key==="Enter" && (e.metaKey||e.ctrlKey) && $("modalBg").classList.contains("show")) saveForm();
  });
  $("search").oninput = render;
  $("statusFilter").onchange = render;
  $("sortBy").onchange = render;
  $("pendingOnly").onchange = render;
  $("exportBtn").onclick = exportData;
  $("importBtn").onclick = function (){ $("importFile").click(); };
  $("importFile").onchange = function (e){ if (e.target.files[0]) importData(e.target.files[0]); e.target.value=""; };
  Array.prototype.forEach.call($("viewSeg").querySelectorAll("button"), function (b) {
    b.onclick = function () {
      view = b.getAttribute("data-view");
      Array.prototype.forEach.call($("viewSeg").querySelectorAll("button"), function (x){ x.classList.toggle("active", x===b); });
      render();
    };
  });

  render();
})();
</script>
</body>
</html>
